<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../statics/css/style.css">
</head>

<body class="dark min-h-screen p-4 md:p-10">

    <!-- Navigation Header -->
    <nav class="rounded-2xl border border-slate-900/5 dark:border-white/10 bg-white/70 dark:bg-white/[0.04] backdrop-blur-xl shadow-xl shadow-slate-900/5 dark:shadow-black/40 mb-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center px-5 py-4">
            <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-br from-slate-900 via-indigo-800 to-violet-700 dark:from-white dark:via-indigo-100 dark:to-indigo-300 bg-clip-text text-transparent">TaskFlow</h1>
            <div class="flex items-center gap-3">
                <button id="darkMode" aria-label="Toggle Dark Mode" class="h-10 w-10 inline-flex items-center justify-center rounded-xl border border-slate-900/10 dark:border-white/10 bg-white/60 dark:bg-white/[0.04] text-base leading-none outline-none transition duration-200 hover:border-indigo-500/40 hover:bg-white dark:hover:bg-white/[0.09] hover:scale-105 focus-visible:ring-4 focus-visible:ring-indigo-500/25 active:scale-95">
                    🌙
                </button>
                <button id="logoutBtn" class="rounded-xl border border-rose-500/25 bg-rose-500/10 text-rose-600 dark:text-rose-300 px-4 py-2 text-sm font-semibold outline-none transition duration-200 hover:bg-rose-500 hover:border-rose-500 hover:text-white hover:shadow-lg hover:shadow-rose-500/25 focus-visible:ring-4 focus-visible:ring-rose-500/25 active:scale-95">
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto">
        <!-- Dashboard Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-5">
            <div>
                <h2 class="text-4xl font-extrabold tracking-tight">My Tasks</h2>
                <p class="text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">Manage your daily work efficiently.</p>
            </div>
            <button id="newTaskBtn" class="rounded-xl bg-gradient-to-r from-indigo-500 to-violet-500 text-white px-5 py-3 font-semibold shadow-lg shadow-indigo-500/25 dark:shadow-indigo-900/40 outline-none transition duration-200 hover:from-indigo-400 hover:to-violet-400 hover:shadow-xl hover:shadow-indigo-500/35 hover:-translate-y-0.5 focus-visible:ring-4 focus-visible:ring-indigo-400/40 active:translate-y-0 active:scale-[0.98]">
                + New Task
            </button>
        </div>

        <!-- Filter & Search Bar -->
        <div class="flex flex-col md:flex-row gap-4 mt-9">
            <input type="text" id="searchInput" placeholder="Search tasks..." class="flex-1 rounded-xl border border-slate-900/10 dark:border-white/10 bg-white/70 dark:bg-white/[0.04] backdrop-blur-md px-4 py-3 outline-none transition duration-200 hover:border-slate-900/20 dark:hover:border-white/20 focus:border-indigo-500/60 focus:bg-white dark:focus:bg-white/[0.07] focus:ring-4 focus:ring-indigo-500/15">

            <div class="flex gap-3">
                <select id="priorityFilter" class="rounded-xl border border-slate-900/10 dark:border-white/10 bg-white/70 dark:bg-white/[0.04] dark:text-white backdrop-blur-md px-4 pr-10 py-3 outline-none transition duration-200 hover:border-slate-900/20 dark:hover:border-white/20 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/15">
                    <option value="">All Priorities</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>

                <select id="sort" class="rounded-xl border border-slate-900/10 dark:border-white/10 bg-white/70 dark:bg-white/[0.04] dark:text-white backdrop-blur-md px-4 pr-10 py-3 outline-none transition duration-200 hover:border-slate-900/20 dark:hover:border-white/20 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/15">
                    <option value="due">Due Date</option>
                    <option value="newest">Newest</option>
                </select>
            </div>
        </div>

        <!-- Task Grid -->
        <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-10"></div>

        <!-- Empty State -->
        <div id="empty" class="hidden text-center py-24">
            <div class="text-6xl mb-4 opacity-90">📭</div>
            <h2 class="text-2xl font-bold mb-2">No Tasks yet</h2>
            <p class="text-slate-500 dark:text-slate-400 leading-relaxed">Create your first task to get started.</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-14 text-sm font-semibold uppercase tracking-[0.18em] text-slate-500 dark:text-slate-400">
            Loading...
        </div>

        <!-- Task Modal -->
        <div id="taskModal" role="dialog" aria-modal="true" class="fixed inset-0 bg-slate-950/60 backdrop-blur-md hidden justify-center items-center p-4 z-50">
            <div class="rounded-2xl border border-slate-900/10 dark:border-white/10 bg-white/90 dark:bg-slate-900/70 backdrop-blur-2xl ring-1 ring-inset ring-white/40 dark:ring-white/5 p-7 w-full max-w-md shadow-2xl shadow-slate-950/30 dark:shadow-black/60">
                <h2 id="modalTitle" class="text-2xl font-bold tracking-tight mb-6">New Task</h2>

                <form id="taskForm">
                    <div class="mb-4">
                        <label for="title" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Title</label>
                        <input id="title" placeholder="Task Title" class="w-full rounded-xl border border-slate-900/10 dark:border-white/10 bg-white dark:bg-white/[0.04] px-4 py-3 outline-none transition duration-200 hover:border-slate-900/20 dark:hover:border-white/20 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/15" required>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Description</label>
                        <textarea id="description" placeholder="Description" rows="3" class="w-full rounded-xl border border-slate-900/10 dark:border-white/10 bg-white dark:bg-white/[0.04] px-4 py-3 leading-relaxed outline-none transition duration-200 hover:border-slate-900/20 dark:hover:border-white/20 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/15"></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="priority" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Priority</label>
                        <select id="priority" class="w-full rounded-xl border border-slate-900/10 dark:border-white/10 bg-white dark:bg-white/[0.04] px-4 pr-10 py-3 outline-none transition duration-200 hover:border-slate-900/20 dark:hover:border-white/20 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/15">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="mb-8">
                        <label for="dueDate" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Due Date</label>
                        <input id="dueDate" type="date" class="w-full rounded-xl border border-slate-900/10 dark:border-white/10 bg-white dark:bg-white/[0.04] px-4 py-3 outline-none transition duration-200 hover:border-slate-900/20 dark:hover:border-white/20 focus:border-indigo-500/60 focus:ring-4 focus:ring-indigo-500/15">
                    </div>

                    <div class="flex justify-end gap-3">
                        <button type="button" id="cancelBtn" class="rounded-xl border border-slate-900/10 dark:border-white/10 bg-slate-900/5 dark:bg-white/[0.05] text-slate-700 dark:text-slate-200 px-4 py-2.5 font-medium outline-none transition duration-200 hover:bg-slate-900/10 dark:hover:bg-white/[0.1] hover:border-slate-900/20 dark:hover:border-white/20 focus-visible:ring-4 focus-visible:ring-slate-400/25 active:scale-95">Cancel</button>
                        <button type="submit" class="rounded-xl bg-gradient-to-r from-indigo-500 to-violet-500 text-white px-5 py-2.5 font-semibold shadow-lg shadow-indigo-500/25 dark:shadow-indigo-900/40 outline-none transition duration-200 hover:from-indigo-400 hover:to-violet-400 hover:shadow-xl hover:shadow-indigo-500/35 focus-visible:ring-4 focus-visible:ring-indigo-400/40 active:scale-95">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-[60] rounded-xl border border-emerald-400/30 bg-emerald-500/90 dark:bg-emerald-500/20 backdrop-blur-xl text-white dark:text-emerald-100 px-5 py-3.5 text-sm font-medium shadow-2xl shadow-emerald-900/30 hidden">
        Saved Successfully
    </div>

    <!-- Scripts -->
    <script src="../statics/js/api.js"></script>
    <script src="../statics/js/ui.js"></script>
    <script src="../statics/js/task.js"></script>
    <script src="../statics/js/dashboard.js"></script>
</body>

</html>
